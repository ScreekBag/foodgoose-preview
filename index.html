<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Foodgoose</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#app{max-width:430px;min-height:100dvh;margin:0 auto;position:relative;overflow:hidden}
.welcome{min-height:100dvh;background:linear-gradient(180deg,#4db4ff 0%,#5ee07a 38%,#ffe98a 72%,#fff 92%);position:relative}
.food{position:absolute;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
.hero{position:absolute;left:24px;right:24px;top:38%;text-align:center;font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.6px}
.ai{display:inline-flex;margin-left:6px;padding:6px 14px;border-radius:999px;background:#111;color:#fff;font-size:22px;vertical-align:middle;box-shadow:0 0 0 3px #111,0 0 0 5px #6CFF4A,0 0 0 7px #5B8CFF,0 0 0 9px #FF7AD9}
.dock{position:absolute;left:18px;right:18px;bottom:28px;display:flex;align-items:center;gap:12px}
.lang{color:#8b8b8b;font-weight:700;font-size:14px}
.cta{flex:1;max-width:230px;margin:0 auto;background:#1c1c1e;color:#fff;border:0;border-radius:999px;padding:18px 28px;font-size:18px;font-weight:700}
.screen{min-height:100dvh;padding:14px 20px 110px;display:flex;flex-direction:column;background:#fff}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.back{width:44px;height:44px;border:0;border-radius:22px;background:#f2f2f2;font-size:22px}
.track{flex:1;height:5px;background:#ececec;border-radius:99px;overflow:hidden}
.bar{height:100%;background:#111;border-radius:99px}
.skip{margin-left:auto;border:0;background:none;color:#b0b0b0;font-weight:600}
h1{font-size:32px;line-height:1.15;font-weight:800;margin:0 0 10px;letter-spacing:-.5px}
.sub{color:#a3a3a3;font-size:16px;line-height:1.35;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;border:0;border-radius:22px;background:#f3f3f3;text-align:left;font-size:17px;font-weight:600;width:100%}
.opt .ic{width:28px;text-align:center;font-size:22px}
.opt .ck{margin-left:auto;width:22px;height:22px;border-radius:11px;background:#111;color:#fff;font-size:13px;display:none;align-items:center;justify-content:center}
.opt.on{background:#8dff62}.opt.on .ck{display:flex}
.tip{position:absolute;left:16px;right:16px;bottom:108px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.08);font-size:15px;font-weight:600}
.next{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:74px;height:74px;border:0;border-radius:37px;background:#f2f2f2;color:#c8c8c8;font-size:34px}
.next.go{background:#1c1c1e;color:#fff}
.proof{min-height:100dvh;background:linear-gradient(180deg,#6CED69 0%,#b8f56a 55%,#fff 100%);padding:14px 18px 110px}
.ptitle{font-size:32px;line-height:1.15;font-weight:800;margin:8px 0 18px}
.pcard{background:#fff;border-radius:28px;padding:16px}
.goal{color:#9aa09a;font-weight:600;margin:0 0 6px}
.plot{position:relative;height:250px}
svg.chart{width:100%;height:200px;display:block;margin-top:24px}
.lbl{position:absolute;font-size:13px;font-weight:700;line-height:1.15}
.pill{position:absolute;z-index:2;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700}
.pg{background:#d8f8b8;color:#1f8a2e}.po{background:#ffe3c8;color:#e86a2d}
.pfoot{border-top:1px solid #eee;margin-top:8px;padding-top:12px;display:flex;gap:10px;align-items:center;font-size:15px}
.info{align-items:center;text-align:center}
.field{background:#f3f3f3;border:0;border-radius:18px;padding:16px;font-size:17px;width:100%;margin:0 0 10px}
.label{color:#8b8b8b;font-weight:600;margin:8px 0 6px;font-size:14px;text-align:left;width:100%}
.plan{font-size:34px;font-weight:800;margin:8px 0}
.card{background:#f3f3f3;border-radius:22px;padding:16px;text-align:left;width:100%}
.macros{display:flex;justify-content:space-around;padding:8px 0;font-weight:800}
.pace{display:flex;gap:8px;width:100%}
.pace button{flex:1;padding:14px;border:0;border-radius:16px;background:#f3f3f3;font-weight:700}
.pace button.on{background:#8dff62}
.header{display:flex;align-items:center;justify-content:space-between}
.left{font-size:48px;font-weight:800;text-align:center}.left span{font-size:15px;color:#8b8b8b;font-weight:600}
.ring{width:168px;height:168px;border:12px solid #8dff62;border-radius:84px;margin:8px auto;display:flex;align-items:center;justify-content:center;color:#8b8b8b}
.meal{display:flex;align-items:center;gap:12px;background:#f3f3f3;border-radius:18px;padding:12px;margin:8px 0}
.kcal{margin-left:auto;font-weight:800;border:0;background:none}
.homeDock{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.homeDock button{flex:1;border:0;background:#f3f3f3;padding:16px;border-radius:18px;font-weight:700}
.close{align-self:flex-end;width:36px;height:36px;border:0;border-radius:18px;background:#f2f2f2}
.pillbtn{background:#1c1c1e;color:#fff;border:0;border-radius:999px;padding:18px 28px;font-size:17px;font-weight:700;margin-top:auto;width:100%}
.tag{display:inline-block;background:#111;color:#fff;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800}
</style></head><body><div id="app"></div>
<script>
