<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodgoose</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.phone{max-width:430px;min-height:100dvh;margin:0 auto;position:relative;overflow:hidden}
.view{display:none;min-height:100dvh;position:relative}
.view.on{display:block}
.welcome{background:linear-gradient(180deg,#4db4ff 0%,#5ee07a 36%,#ffe98a 70%,#fff 92%);overflow:hidden}
.food{position:absolute;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12));pointer-events:none}
.hero{position:absolute;left:22px;right:22px;top:34%;text-align:center;font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.7px;z-index:2}
.g{display:inline-flex;align-items:center;justify-content:center;margin:0 0 0 6px;padding:7px 14px;vertical-align:middle;border-radius:999px;background:#111;color:#fff;font-size:22px;font-weight:800;letter-spacing:-.2px;line-height:1;box-shadow:0 0 0 3px #111,0 0 0 5px #6CFF4A,0 0 0 7px #5B8CFF,0 0 0 9px #FF7AD9}
.dock{position:absolute;left:16px;right:16px;bottom:26px;display:flex;align-items:center;z-index:3}
.lang{display:flex;align-items:center;gap:6px;color:#8b8b8b;font-weight:700;font-size:14px;min-width:64px}
.cta{margin:0 auto;background:#1c1c1e;color:#fff;border:0;border-radius:999px;padding:18px 42px;font-size:18px;font-weight:700}
.screen{padding:14px 20px 110px;background:#fff}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.back{width:44px;height:44px;border:0;border-radius:22px;background:#f2f2f2;font-size:22px}
.track{flex:1;height:5px;background:#ececec;border-radius:99px;overflow:hidden}
.bar{height:100%;background:#111}
h1{font-size:32px;line-height:1.15;font-weight:800;margin:0 0 10px}
.sub{color:#a3a3a3;font-size:16px;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:14px 16px;border:0;border-radius:22px;background:#f3f3f3;text-align:left;font-size:17px;font-weight:600;width:100%}
.opt.on{background:#8dff62}
.ck{margin-left:auto;width:22px;height:22px;border-radius:11px;background:#111;color:#fff;display:none;align-items:center;justify-content:center}
.opt.on .ck{display:flex}
.tip{position:absolute;left:16px;right:16px;bottom:108px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.08);font-weight:600}
.next{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:74px;height:74px;border:0;border-radius:37px;background:#1c1c1e;color:#fff;font-size:34px}
.proof{background:linear-gradient(180deg,#6CED69 0%,#b8f56a 55%,#fff 100%);padding:14px 18px 110px}
.pcard{background:#fff;border-radius:28px;padding:16px}
.pillbtn{background:#1c1c1e;color:#fff;border:0;border-radius:999px;padding:18px 28px;font-size:17px;font-weight:700;width:calc(100% - 40px);position:absolute;left:20px;bottom:28px}
</style></head>
<body>
<div class="phone">
<div class="view on welcome" id="welcome">
  <div class="food" style="left:16px;top:5%;font-size:42px">avocado</div>
  <div class="hero">Track food<br>& calories<br>with <span class="g">goose</span></div>
  <div class="dock">
    <div class="lang">EN</div>
    <button class="cta" type="button" onclick="show('goal')">Get Started</button>
  </div>
</div>
</div>
<script>
function show(id){
  var el=document.getElementById(id);
  if(el){el.classList.add('on');}
}
function pick(el){el.classList.add('on');}
</script>
</body></html>
